[mod-name]
sprint=Sprint
[mod-description]
sprint=Nhà máy cần lớn hơn, không phải quãng đường đi bộ. Nhấn Ctrl trái để chạy x4, chỉnh tốc độ ngay trong game.\n\nGrow the factory, not your step count. Press Left Ctrl to sprint at 4x speed and adjust it in-game.
[controls]
sprint-toggle-ctrl=Toggle sprint
[sprint]
toggle=Sprint: __1__
on=ON
off=OFF
hint=Left-click to toggle sprint. Right-click to show/hide speed controls. Default hotkey: Left Ctrl. Remap in Settings > Controls > Mods.
multiplier=Speed multiplier
apply=Apply
invalid=Enter a multiplier from 1 to 100.
