[mod-name]
sprint=Sprint
[mod-description]
sprint=Unbegrenzten Sprint mit der linken Strg-Taste ein- oder ausschalten. Standardmäßig 4-fache aktuelle Bewegungsgeschwindigkeit, einschließlich Boni durch Ausrüstung und andere Mods. Den Faktor direkt im Spiel ohne Neustart ändern.
[controls]
sprint-toggle-ctrl=Sprint umschalten
[sprint]
toggle=Sprint: __1__
on=AN
off=AUS
hint=Linksklick schaltet Sprint um. Rechtsklick zeigt oder verbirgt die Geschwindigkeitseinstellungen. Standardtaste: linke Strg-Taste. Änderbar unter Einstellungen > Steuerung > Mods.
multiplier=Geschwindigkeitsfaktor
apply=Anwenden
invalid=Gib einen Faktor zwischen 1 und 100 ein.
