[mod-name]
sprint=Sprint
[mod-description]
sprint=按左 Ctrl 开启或关闭无限冲刺。默认速度为当前移动速度的 4 倍，包含装备和其他模组的加成。可在游戏内即时调整倍率，无需重启。
[controls]
sprint-toggle-ctrl=切换冲刺
[sprint]
toggle=冲刺：__1__
on=开启
off=关闭
hint=左键切换冲刺，右键显示或隐藏速度设置。默认快捷键：左 Ctrl。可在设置 > 控制 > 模组中修改。
multiplier=速度倍率
apply=应用
invalid=请输入 1 到 100 之间的倍率。
