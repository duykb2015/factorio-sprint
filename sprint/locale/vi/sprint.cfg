[mod-name]
sprint=Sprint
[mod-description]
sprint=Bật/tắt chạy nhanh không giới hạn bằng Ctrl trái. Mặc định x4 tốc độ di chuyển hiện tại, bao gồm bonus từ trang bị và mod khác. Chỉnh hệ số ngay trong game, không cần khởi động lại.\n\nToggle unlimited sprint with Left Ctrl. Default 4x your current movement speed, including equipment and other mod bonuses. Adjust the multiplier instantly in-game without restarting.
[controls]
sprint-toggle-ctrl=Bật/tắt chạy nhanh
[sprint]
toggle=Chạy nhanh: __1__
on=BẬT
off=TẮT
hint=Nhấp trái để bật/tắt chạy nhanh. Nhấp phải để hiện/ẩn phần chỉnh tốc độ. Phím mặc định: Ctrl trái. Đổi phím trong Cài đặt > Điều khiển > Mod.
multiplier=Hệ số tốc độ
apply=Áp dụng
invalid=Nhập hệ số từ 1 đến 100.
