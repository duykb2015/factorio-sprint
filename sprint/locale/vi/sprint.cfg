[mod-name]
sprint=Sprint
[mod-description]
sprint=Nhà máy cần lớn hơn, không phải quãng đường đi bộ. Nhấn Ctrl trái để chạy x4, chỉnh tốc độ ngay trong game.\n\nGrow the factory, not your step count. Press Left Ctrl to sprint at 4x speed and adjust it in-game.
[controls]
sprint-toggle-ctrl=Bật/tắt chạy nhanh
[sprint]
toggle=Chạy nhanh: __1__
on=BẬT
off=TẮT
hint=Nhấp trái để bật/tắt chạy nhanh. Nhấp phải để hiện/ẩn phần chỉnh tốc độ. Phím mặc định: Ctrl trái. Đổi phím trong Cài đặt > Điều khiển > Mod.
multiplier=Hệ số tốc độ
apply=Áp dụng
invalid=Nhập hệ số từ 1 đến 100.
