[mod-name]
sprint=Sprint
[mod-description]
sprint=Activa o desactiva el esprint ilimitado con Ctrl izquierdo. Por defecto, multiplica por 4 tu velocidad actual, incluidas las bonificaciones del equipo y otros mods. Ajusta el multiplicador al instante sin reiniciar.
[controls]
sprint-toggle-ctrl=Activar/desactivar esprint
[sprint]
toggle=Esprint: __1__
on=ACTIVADO
off=DESACTIVADO
hint=Clic izquierdo para alternar el esprint. Clic derecho para mostrar u ocultar los controles de velocidad. Tecla predeterminada: Ctrl izquierdo. Puedes cambiarla en Ajustes > Controles > Mods.
multiplier=Multiplicador de velocidad
apply=Aplicar
invalid=Introduce un multiplicador entre 1 y 100.
