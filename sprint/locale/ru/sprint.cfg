[mod-name]
sprint=Sprint
[mod-description]
sprint=Включайте и выключайте неограниченный спринт левым Ctrl. По умолчанию текущая скорость передвижения увеличивается в 4 раза с учётом бонусов снаряжения и других модов. Меняйте множитель прямо в игре без перезапуска.
[controls]
sprint-toggle-ctrl=Переключить спринт
[sprint]
toggle=Спринт: __1__
on=ВКЛ
off=ВЫКЛ
hint=Левая кнопка мыши переключает спринт. Правая показывает или скрывает настройки скорости. Клавиша по умолчанию: левый Ctrl. Изменить её можно в Настройки > Управление > Моды.
multiplier=Множитель скорости
apply=Применить
invalid=Введите множитель от 1 до 100.
